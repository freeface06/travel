<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    @intent MyTripLog 단일 진실 원천(SSOT) 진입점 웹 애플리케이션 (지도 플로팅 컨트롤 정리 및 클린 지도 뷰포트 확보)
    @agent  Gemini/manager-develop
    @branch feat/mytriplog-core
    @author @developer_name
    @date   2026-09-29
  -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MyTripLog - 여행 일정 & 1/N 최소 송금 정산기</title>

  <!-- 파비콘 설정 (404 방지 및 브라우저 탭 아이콘) -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico" />
  <link rel="apple-touch-icon" href="favicon.svg" />

  <!--
    지능형 하이브리드 지도 엔진:
    - Google Maps API 키가 설정되어 있으면 고화질 Google Maps로 동작
    - API 키가 없거나 플레이스홀더인 경우 Leaflet(OpenStreetMap)으로 무오류 자동 폴백
  -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <!-- LZ-String CDN (무서버 압축 공유) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js" crossorigin=""></script>

  <!-- 스타일시트 (캐시 버스팅 적용) -->
  <link rel="stylesheet" href="css/reset.css?v=20260929_1720" />
  <link rel="stylesheet" href="css/variables.css?v=20260929_1720" />
  <link rel="stylesheet" href="css/layout.css?v=20260929_1720" />
  <link rel="stylesheet" href="css/components.css?v=20260929_1720" />
</head>
<body>
  <div class="app-container">
    <!-- 상단 헤더 -->
    <header class="app-header">
      <div class="header-brand">
        <div class="brand-logo-badge">
          <!-- 비행기 SVG 아이콘 -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
          </svg>
        </div>
        <div class="brand-info brand-info-clickable" id="brand-info" role="button" tabindex="0" title="여행 계획 목록 및 비교 열기" style="cursor: pointer;">
          <div class="brand-title-wrap" style="display: inline-flex; align-items: center; gap: 4px;">
            <h1 id="trip-title" class="brand-title">로딩 중...</h1>
            <svg class="brand-title-arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true" style="opacity: 0.7; flex-shrink: 0;">
              <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
            </svg>
          </div>
          <span id="trip-period" class="brand-period">기간 로딩 중</span>
        </div>
      </div>

      <div class="header-actions">
        <button type="button" id="btn-manage-trips" class="btn-header-action" title="여행 계획 목록 및 비교" aria-label="여행 계획 목록 및 비교">
          <!-- 폴더/목록 스타일 SVG 아이콘 -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>
          </svg>
          <span class="btn-header-label">계획 목록</span>
        </button>
        <button type="button" id="btn-copy-share-link" class="btn-header-action" title="여행 일정 링크 복사" aria-label="여행 일정 링크 복사">
          <!-- 링크 공유 SVG 아이콘 -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/>
          </svg>
          <span class="btn-header-label">링크 복사</span>
        </button>
        <button type="button" id="btn-edit-trip" class="btn-header-action" title="여행 정보 수정" aria-label="여행 정보 수정">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
          </svg>
          <span class="btn-header-label">여행 설정</span>
        </button>
      </div>
    </header>

    <!-- 상단 일차(Day) 칩 슬라이더 바 (모바일 및 데스크톱 공통 상단 네비게이션) -->
    <div class="day-chip-slider-wrapper" id="day-chip-slider-wrapper">
      <div class="day-selector-bar" id="day-selector-bar">
        <!-- 일차 칩 동적 렌더링 -->
      </div>
    </div>

    <!-- 메인 분할 뷰 -->
    <main class="app-body">
      <!-- 좌측 사이드 패널 (모바일에서는 출몰형 바텀시트로 변환) -->
      <aside class="side-panel sheet-half" id="side-panel">
        <!-- 모바일 바텀시트 전용 핸들 컨테이너 -->
        <div class="bottom-sheet-handle-container">
          <div class="bottom-sheet-handle" id="bottom-sheet-handle" title="드래그하거나 탭하여 크기 조절">
            <div class="bottom-sheet-handle-bar"></div>
          </div>
        </div>

        <!-- 기능 네비게이션 탭 -->
        <!-- 기능 네비게이션 탭 (일정, 경비) -->
        <nav class="panel-nav-tabs">
          <button type="button" class="panel-nav-btn active" id="tab-timeline">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/>
            </svg>
            <span>일정 타임라인</span>
          </button>
          <button type="button" class="panel-nav-btn" id="tab-expense">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/>
            </svg>
            <span>여행 경비 정산</span>
          </button>
        </nav>

        <!-- 탭 컨텐츠 영역 -->
        <div class="panel-content-area" id="panel-content-area">
          <!-- 타임라인 또는 정산 또는 공유 렌더링 -->
        </div>
      </aside>

      <!-- 우측 Google 지도 영역 -->
      <section class="map-view-container" aria-label="여행 지도">
        <div id="map-container"></div>

        <!-- Google Maps API 키 안내 오버레이 배너 -->
        <div id="map-api-key-banner" class="map-api-key-banner hidden">
          <div class="map-banner-card">
            <div class="map-banner-icon">
              <!-- 정보 알림 SVG 아이콘 -->
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
              </svg>
            </div>
            <div class="map-banner-content">
              <h3 class="map-banner-title">Google Maps API 키 설정 필요</h3>
              <p class="map-banner-desc">
                Google Maps를 정상적으로 렌더링하려면 <code>index.html</code> 상단의
                <code>YOUR_GOOGLE_MAPS_API_KEY</code>를 발급받은 Google Cloud API 키로 교체해 주십시오.
              </p>
              <p class="map-banner-sub">
                * API 키 미입력 상태에서도 장소 검색(오픈스트리트맵 폴백) 및 일정/정산 기능은 온전히 동작합니다.
              </p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- 모바일 전용 네이티브 앱 스타일 하단 네비게이션 바 -->
    <nav class="mobile-bottom-nav" id="mobile-bottom-nav" aria-label="모바일 하단 내비게이션">
      <button type="button" class="m-nav-item" id="m-nav-map" data-target="map">
        <div class="m-nav-icon">
          <!-- 지도 SVG 아이콘 -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/>
          </svg>
        </div>
        <span class="m-nav-label">지도</span>
      </button>

      <button type="button" class="m-nav-item active" id="m-nav-timeline" data-target="timeline">
        <div class="m-nav-icon">
          <!-- 캘린더/일정 SVG 아이콘 -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/>
          </svg>
        </div>
        <span class="m-nav-label">일정</span>
      </button>

      <button type="button" class="m-nav-item" id="m-nav-add" title="새 일정 추가" aria-label="새 일정 추가">
        <div class="m-nav-icon">
          <!-- 플러스 SVG 아이콘 -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
          </svg>
        </div>
        <span class="m-nav-label">추가</span>
      </button>

      <button type="button" class="m-nav-item" id="m-nav-expense" data-target="expense">
        <div class="m-nav-icon">
          <!-- 경비/화폐 SVG 아이콘 -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/>
          </svg>
        </div>
        <span class="m-nav-label">경비</span>
      </button>
    </nav>
  </div>

  <!-- 지도 핀 위치 선택 오버레이 바 -->
  <div id="pin-picker-bar" class="pin-picker-bar hidden">
    <div class="pin-picker-info">
      <span class="pin-picker-guide">지도에서 원하는 위치를 클릭하세요</span>
      <span class="pin-picker-address" id="pin-picker-address">위치를 선택해 주세요</span>
    </div>
    <div class="pin-picker-actions">
      <button type="button" id="btn-pin-picker-cancel" class="btn btn-secondary btn-sm">취소</button>
      <button type="button" id="btn-pin-picker-confirm" class="btn btn-primary btn-sm" disabled>선택 완료</button>
    </div>
  </div>

  <!-- 공통 모달 대화상자 -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title">일정 편집</h2>
        <button type="button" id="modal-close-btn" class="btn-icon" aria-label="닫기">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
          </svg>
        </button>
      </div>
      <div class="modal-body" id="modal-container">
        <!-- 동적 폼 삽입 -->
      </div>
    </div>
  </div>

  <!-- 사진 전체 화면 라이트박스 (갤러리 네비게이션 및 카운터 포함) -->
  <div class="lightbox-overlay" id="lightbox-overlay" role="dialog" aria-modal="true">
    <button type="button" class="lightbox-close-btn" id="btn-close-lightbox" title="닫기">&times;</button>
    <button type="button" class="lightbox-nav-btn prev hidden" id="btn-lightbox-prev" title="이전 사진">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </button>
    <div class="lightbox-content-box">
      <img id="lightbox-img" src="" alt="확대 사진" />
      <div id="lightbox-counter" class="lightbox-counter hidden">1 / 1</div>
    </div>
    <button type="button" class="lightbox-nav-btn next hidden" id="btn-lightbox-next" title="다음 사진">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
    </button>
  </div>

  <!-- 토스트 알림 컨테이너 -->
  <div class="toast-container" id="toast-container"></div>

  <!-- 스크립트 모듈 로드 (캐시 버스팅 적용) -->
  <script src="js/icons.js?v=20260929_1720"></script>
  <script src="js/db.js?v=20260929_1720"></script>
  <script src="js/expense.js?v=20260929_1720"></script>
  <script src="js/store.js?v=20260929_1720"></script>
  <script src="js/geocoder.js?v=20260929_1720"></script>
  <script src="js/map.js?v=20260929_1720"></script>
  <script src="js/forms.js?v=20260929_1720"></script>
  <script src="js/share.js?v=20260929_1720"></script>
  <script src="js/app.js?v=20260929_1720"></script>
</body>
</html>
